<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Controller</title>
<style>
  body { font-family: Consolas, 'Courier New', monospace; background:#111; color:#eee; text-align:center; padding:20px; max-width:480px; margin:0 auto; box-sizing:border-box; }
  img { width:100%; max-width:480px; border-radius:8px; margin-top:16px; background:#000; }
  button { font-family: inherit; width:100%; box-sizing:border-box; font-size:1.5em; padding:16px 32px; border-radius:8px; border:none; background:#c0392b; color:#fff; margin-top:16px; }
  button:active { background:#992d22; }
  #resetBtn { background:#2980b9; }
  #resetBtn:active { background:#20628e; }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:16px; width:100%; }
  .row button { width:auto; margin-top:0; font-size:1.1em; padding:14px 20px; flex:1 1 0; }
  #logBtn { background:#2980b9; }
  #logBtn:active { background:#20628e; }
  #clearLogBtn { background:#7f8c8d; }
  #clearLogBtn:active { background:#616a6b; }
  #placeBtn { background:#27ae60; }
  #placeBtn:active { background:#1e8449; }
  #clearBtn { background:#7f8c8d; }
  #clearBtn:active { background:#616a6b; }
  #wallBtn { background:#8e44ad; }
  #wallBtn:active { background:#6c3483; }
  #clearWallsBtn { background:#7f8c8d; }
  #clearWallsBtn:active { background:#616a6b; }
  #mazeBtn { background:#16a085; }
  #mazeBtn:active { background:#117a65; }
  #clearMazeBtn { background:#7f8c8d; }
  #clearMazeBtn:active { background:#616a6b; }
  #mazeInfo { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:10px; text-align:left; }
  #mazeExtendLabel { display:flex; align-items:center; gap:8px; }
  #mazeExtend { width:22px; height:22px; accent-color:#16a085; margin:0; }
  #recordToggleBtn.recording { background:#7f8c8d; }
  #recordToggleBtn.recording:active { background:#616a6b; }
  #status { margin-top:8px; color:#9a9; }
  #gps { margin-top:12px; font-size:1.1em; color:#eee; }
  #gps .stale { color:#888; }
  #loggedList { list-style:none; padding:0; margin:12px auto 0; max-width:480px; max-height:220px; overflow-y:auto; text-align:left; font-family:monospace; font-size:0.85em; }
  #loggedList li { padding:6px 8px; border-bottom:1px solid #333; }
  #loggedList li:nth-child(odd) { background:#1a1a1a; }
  #gridSizeRow { margin-top:16px; text-align:left; }
  #gridSizeRow label { font-size:1.1em; }
  #gridSizeSlider { width:100%; accent-color:#2980b9; margin-top:8px; }
</style>
</head>
<body>
<h2>GPS Controller</h2>
<img id="preview" src="" alt="camera preview">
<button id="resetBtn">Zero-Out Player Position</button>
<div class="row" style="display:none">
  <button id="logBtn">Log Position</button>
  <button id="clearLogBtn">Clear Logged Positions</button>
</div>
<div class="row">
  <button id="placeBtn">Place Marker</button>
  <button id="clearBtn">Clear Markers</button>
</div>
<div class="row">
  <button id="wallBtn">Spawn Wall</button>
  <button id="clearWallsBtn">Clear Walls</button>
</div>
<div class="row">
  <button id="mazeBtn">Generate Maze</button>
  <button id="clearMazeBtn">Clear Maze</button>
</div>
<div id="mazeInfo">
  <span>Seed: <span id="mazeSeed">-</span></span>
  <label id="mazeExtendLabel"><input type="checkbox" id="mazeExtend"> Extend at exit</label>
</div>
<div id="gridSizeRow">
  <label for="gridSizeSlider">Grid Cells: <span id="gridSizeValue">5</span></label>
  <input type="range" id="gridSizeSlider" min="1" max="40" step="1" value="5">
</div>
<div id="status"></div>
<div id="gps">Waiting for fix...</div>
<ul id="loggedList" style="display:none"></ul>
<button id="recordToggleBtn">Start Recording</button>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  const status = document.getElementById('status');
  const preview = document.getElementById('preview');

  document.getElementById('resetBtn').onclick = async () => {
    status.textContent = 'Resetting...';
    try {
      const res = await fetch('/reset?token=' + encodeURIComponent(token), { method: 'POST' });
      status.textContent = res.ok ? 'Reset sent.' : 'Failed: ' + res.status;
    } catch (e) {
      status.textContent = 'Error: ' + e;
    }
  };

  // One long-lived MJPEG connection, so frames render as fast as Unity sends
  // them. The old approach reloaded a still every 1.5s, which capped the
  // preview at well under 1fps no matter how often Unity uploaded.
  let pollTimer = null;
  function startStream() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
    // The timestamp makes this a new URL, since assigning the same src again
    // wouldn't reconnect.
    preview.src = '/snapshot.mjpeg?token=' + encodeURIComponent(token) + '&t=' + Date.now();
  }

  // Fallback to the original still-polling if the stream can't be held open
  // (some mobile proxies buffer multipart responses instead of passing them
  // through). Slower, but better than a blank panel.
  preview.onerror = () => {
    if (pollTimer) return;
    pollTimer = setInterval(() => {
      preview.src = '/snapshot.jpg?token=' + encodeURIComponent(token) + '&t=' + Date.now();
    }, 500);
  };

  startStream();

  // A stream cut off by the server going away blanks the image without firing
  // any event on it, so the 1.5s GPS poll below doubles as the way to notice:
  // once a request has failed, the next one to get through reconnects it.
  let serverLost = false;

  const gps = document.getElementById('gps');
  async function refreshGps() {
    try {
      const res = await fetch('/gps.json?token=' + encodeURIComponent(token) + '&t=' + Date.now());
      if (serverLost) {
        serverLost = false;
        startStream();
      }
      if (!res.ok) return;
      const fix = await res.json();
      gps.textContent = `Lat: ${fix.lat.toFixed(7)}  Lon: ${fix.lon.toFixed(7)}  (${fix.fixStatus})`;
    } catch (e) {
      // leave last-known value on screen rather than blanking it
      serverLost = true;
    }
  }
  setInterval(refreshGps, 1500);
  refreshGps();

  const loggedList = document.getElementById('loggedList');
  async function refreshLoggedPositions() {
    try {
      const res = await fetch('/logged-positions.json?token=' + encodeURIComponent(token) + '&t=' + Date.now());
      if (!res.ok) return;
      const positions = await res.json();
      loggedList.innerHTML = '';
      positions.slice().reverse().forEach((fix, i) => {
        const li = document.createElement('li');
        li.textContent = `#${positions.length - i}  ${fix.lat.toFixed(7)}, ${fix.lon.toFixed(7)}  (${fix.fixStatus})`;
        loggedList.appendChild(li);
      });
    } catch (e) {
      // leave the existing list on screen
    }
  }
  refreshLoggedPositions();

  document.getElementById('logBtn').onclick = async () => {
    status.textContent = 'Logging...';
    try {
      const res = await fetch('/log-position?token=' + encodeURIComponent(token), { method: 'POST' });
      status.textContent = res.ok ? 'Position logged.' : 'Failed: ' + res.status;
      if (res.ok) refreshLoggedPositions();
    } catch (e) {
      status.textContent = 'Error: ' + e;
    }
  };

  document.getElementById('clearLogBtn').onclick = async () => {
    status.textContent = 'Clearing logged positions...';
    try {
      const res = await fetch('/clear-logged-positions?token=' + encodeURIComponent(token), { method: 'POST' });
      status.textContent = res.ok ? 'Logged positions cleared.' : 'Failed: ' + res.status;
      if (res.ok) refreshLoggedPositions();
    } catch (e) {
      status.textContent = 'Error: ' + e;
    }
  };

  document.getElementById('placeBtn').onclick = async () => {
    status.textContent = 'Placing marker...';
    try {
      const res = await fetch('/place-marker?token=' + encodeURIComponent(token), { method: 'POST' });
      status.textContent = res.ok ? 'Marker placed.' : 'Failed: ' + res.status;
    } catch (e) {
      status.textContent = 'Error: ' + e;
    }
  };

  document.getElementById('clearBtn').onclick = async () => {
    status.textContent = 'Clearing markers...';
    try {
      const res = await fetch('/clear-markers?token=' + encodeURIComponent(token), { method: 'POST' });
      status.textContent = res.ok ? 'Markers cleared.' : 'Failed: ' + res.status;
    } catch (e) {
      status.textContent = 'Error: ' + e;
    }
  };

  document.getElementById('wallBtn').onclick = async () => {
    status.textContent = 'Spawning wall...';
    try {
      const res = await fetch('/spawn-wall?token=' + encodeURIComponent(token), { method: 'POST' });
      status.textContent = res.ok ? 'Wall spawned.' : 'Failed: ' + res.status;
    } catch (e) {
      status.textContent = 'Error: ' + e;
    }
  };

  document.getElementById('clearWallsBtn').onclick = async () => {
    status.textContent = 'Clearing walls...';
    try {
      const res = await fetch('/clear-walls?token=' + encodeURIComponent(token), { method: 'POST' });
      status.textContent = res.ok ? 'Walls cleared.' : 'Failed: ' + res.status;
    } catch (e) {
      status.textContent = 'Error: ' + e;
    }
  };

  const mazeSeed = document.getElementById('mazeSeed');
  const mazeExtend = document.getElementById('mazeExtend');
  function showMaze(state) {
    mazeSeed.textContent = state.seed === null ? '-' : state.seed;
    mazeExtend.checked = state.extend;
  }

  async function refreshMaze() {
    try {
      const res = await fetch('/maze.json?token=' + encodeURIComponent(token) + '&t=' + Date.now());
      if (res.ok) showMaze(await res.json());
    } catch (e) {
      // leave the current values on screen
    }
  }
  refreshMaze();

  document.getElementById('mazeBtn').onclick = async () => {
    status.textContent = 'Generating maze...';
    try {
      const res = await fetch('/generate-maze?token=' + encodeURIComponent(token), { method: 'POST' });
      if (res.ok) {
        const state = await res.json();
        showMaze(state);
        status.textContent = 'Maze generated (seed ' + state.seed + ').';
      } else {
        status.textContent = 'Failed: ' + res.status;
      }
    } catch (e) {
      status.textContent = 'Error: ' + e;
    }
  };

  document.getElementById('clearMazeBtn').onclick = async () => {
    status.textContent = 'Clearing maze...';
    try {
      const res = await fetch('/clear-maze?token=' + encodeURIComponent(token), { method: 'POST' });
      status.textContent = res.ok ? 'Maze cleared.' : 'Failed: ' + res.status;
    } catch (e) {
      status.textContent = 'Error: ' + e;
    }
  };

  mazeExtend.onchange = async () => {
    const enabled = mazeExtend.checked;
    status.textContent = 'Updating maze...';
    try {
      const res = await fetch('/maze-extend?token=' + encodeURIComponent(token) + '&enabled=' + (enabled ? 1 : 0), { method: 'POST' });
      status.textContent = res.ok ? (enabled ? 'Maze will extend at the exit.' : 'Maze extending off.') : 'Failed: ' + res.status;
      if (!res.ok) mazeExtend.checked = !enabled;
    } catch (e) {
      status.textContent = 'Error: ' + e;
      mazeExtend.checked = !enabled;
    }
  };

  let isRecording = false;
  const recordToggleBtn = document.getElementById('recordToggleBtn');
  recordToggleBtn.onclick = async () => {
    const endpoint = isRecording ? '/stop-recording' : '/start-recording';
    status.textContent = isRecording ? 'Stopping recording...' : 'Starting recording...';
    try {
      const res = await fetch(endpoint + '?token=' + encodeURIComponent(token), { method: 'POST' });
      if (res.ok) {
        isRecording = !isRecording;
        recordToggleBtn.textContent = isRecording ? 'Stop Recording' : 'Start Recording';
        recordToggleBtn.classList.toggle('recording', isRecording);
        status.textContent = isRecording ? 'Recording started.' : 'Recording stopped.';
      } else {
        status.textContent = 'Failed: ' + res.status;
      }
    } catch (e) {
      status.textContent = 'Error: ' + e;
    }
  };

  const gridSizeSlider = document.getElementById('gridSizeSlider');
  const gridSizeValue = document.getElementById('gridSizeValue');
  gridSizeSlider.oninput = () => {
    gridSizeValue.textContent = gridSizeSlider.value;
  };
  gridSizeSlider.onchange = async () => {
    status.textContent = 'Updating grid size...';
    try {
      const res = await fetch('/grid-size?token=' + encodeURIComponent(token) + '&cells=' + gridSizeSlider.value, { method: 'POST' });
      status.textContent = res.ok ? 'Grid size updated.' : 'Failed: ' + res.status;
    } catch (e) {
      status.textContent = 'Error: ' + e;
    }
  };
</script>
</body>
</html>
